name: Temporary appearance rendering diagnosis
on:
  push:
    branches: [fix/phase-five-deployment]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/appearance-baseline.spec.ts
        continue-on-error: true
      - name: Diagnose pixel differences
        run: |
          node <<'JS'
          const fs = require('fs');
          const { PNG } = require('./node_modules/playwright-core/lib/utilsBundle.js');
          const { deflateSync } = require('zlib');
          for (const f of fs.readdirSync('test-results', { recursive:true }).filter(f=>f.endsWith('-actual.png'))) {
            const actual=PNG.sync.read(fs.readFileSync('test-results/'+f));
            const expected=PNG.sync.read(fs.readFileSync('test-results/'+f.replace('-actual.png','-expected.png')));
            const diffs=[];
            for(let i=0;i<actual.width*actual.height;i++) if(!actual.data.subarray(i*4,i*4+4).equals(expected.data.subarray(i*4,i*4+4))) {
              const b=Buffer.alloc(8); b.writeUInt32LE(i); actual.data.copy(b,4,i*4,i*4+4); diffs.push(b);
            }
            const encoded=deflateSync(Buffer.concat(diffs)).toString('base64');
            console.log('::notice title=Pixel count::'+diffs.length);
            for(let i=0;i<encoded.length;i+=3800) console.log(`::notice title=Pixels ${i}::${encoded.slice(i,i+3800)}`);
          }
          JS
