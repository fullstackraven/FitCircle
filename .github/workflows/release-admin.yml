name: Release registry administration
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Initialize approved history or reconcile a blocked deployment
        required: true
        type: choice
        options: [initialize, reconcile, dry-run]
permissions:
  contents: read
concurrency:
  group: fitcircle-production-release
  cancel-in-progress: false
jobs:
  administer:
    if: github.ref == 'refs/heads/main'
    environment: release-admin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      deployments: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Approved registry operation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_APPROVED: 'true'
          OPERATION: ${{ inputs.operation }}
        run: npx tsx scripts/release/cli.ts "$OPERATION"
