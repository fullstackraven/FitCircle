name: Deploy FitCircle to GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual runs validate completely but never publish, even on main.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'fitcircle-production-release' || format('github-pages-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Plan exact production candidate
        id: plan
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/release/simple.ts plan
      - run: npm run check
      - run: npx tsc --noEmit -p tests/tsconfig.regressions.json
      - run: npm test
      - run: npm run audit:storage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-candidate
          path: .release-candidate.json
          include-hidden-files: true
      # Build exactly once. All browser shards and Pages consume this same
      # immutable artifact from this run, never an artifact from a PR run.
      - uses: actions/upload-artifact@v4
        with:
          name: tested-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  browser:
    name: browser (${{ matrix.shard }}/4)
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/tests/fixtures/screenshot-fonts.conf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tested-site
          path: dist/
      - name: Verify production artifact
        run: |
          for file in index.html sw.js 404.html manifest.json .nojekyll; do
            test -f "dist/$file"
          done
      # Preserve the exact reference browser, OS, fonts and worker count.
      # Native Playwright sharding preserves file/serial-suite semantics.
      - name: Install reference screenshot browser
        run: |
          # Avoid HTTP/2 stream failures (curl 92) on the browser CDN.
          # Retry transport failures as well as HTTP failures; never skip tests.
          curl --http1.1 --fail --location --retry 2 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.57/linux64/chrome-linux64.zip \
            -o "$RUNNER_TEMP/chrome.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/fitcircle-browser"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$RUNNER_TEMP/fitcircle-browser/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - run: npm run test:e2e -- --workers=2 --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Keep the existing required-check name. Always evaluate failed/skipped
  # dependencies so a failed shard cannot leave this check pending or green.
  build:
    needs: [prepare, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every validation job
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$PREPARE_RESULT" != success || "$BROWSER_RESULT" != success ]]; then
            echo "::error::Validation failed: prepare=$PREPARE_RESULT, browser=$BROWSER_RESULT"
            exit 1
          fi

  deploy:
    needs: [prepare, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-site
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  record_release:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: .
      - name: Record successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/release/simple.ts publish
