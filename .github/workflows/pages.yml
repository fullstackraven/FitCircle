name: Deploy FitCircle to GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Inspect screenshot failure evidence
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const file of fs.readdirSync('test-results', { recursive: true }).filter(f => /(?:actual|diff)\.png$/.test(f))) {
            const encoded = fs.readFileSync(`test-results/${file}`).toString('base64');
            for (let offset = 0; offset < encoded.length; offset += 30000)
              console.log(`::notice title=Image ${file} ${offset}::${encoded.slice(offset, offset + 30000)}`);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
