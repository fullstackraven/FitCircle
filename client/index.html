<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- appearance-startup:start -->
    <style>
      html { background: #0f172a; color-scheme: dark; --startup-background: #0f172a; --startup-foreground: #fff; }
      html[data-appearance="light"] { background: #f8fafc; color-scheme: light; --startup-background: #f8fafc; --startup-foreground: hsl(222 47% 11%); }
      body { background: inherit; }
      #fitcircle-recover { border-radius:var(--radius-pill,9999px); min-height:44px; padding:10px 12px; }
      #fitcircle-startup { background: var(--startup-background); color: var(--startup-foreground); }
    </style>
    <script id="fitcircle-appearance-bootstrap">
      // Small pre-paint decision table, parity-tested against appearance.ts.
      // No writes, listeners, fitness-data recovery or second theme controller.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('fitcircle_appearance');
          const pending = localStorage.getItem('fitcircle_restore_journal_v2');
          if (pending) {
            // Read only the previous appearance when rollback is pending. The
            // real recovery still validates/restores all data before App loads.
            const previous = JSON.parse(pending);
            if (previous && Object.prototype.hasOwnProperty.call(previous, 'fitcircle_appearance'))
              preference = previous.fitcircle_appearance;
          }
        } catch { preference = undefined; }
        let systemDark = true;
        try { if (typeof matchMedia === 'function') systemDark = matchMedia('(prefers-color-scheme: dark)').matches !== false; } catch { /* Dark fallback. */ }
        const appearance = preference === 'light' || (preference === 'system' && !systemDark) ? 'light' : 'dark';
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.style.colorScheme = appearance;
        document.querySelector('meta[name="theme-color"]').content = appearance === 'light' ? '#f8fafc' : '#0f172a';
      })();
    </script>
    <!-- appearance-startup:end -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FitCircle" />
    <title>FitCircle</title>

    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%2300ff41' stroke-width='8'/><circle cx='50' cy='50' r='40' fill='none' stroke='%2300ff41' stroke-width='8' stroke-dasharray='251.2' stroke-dashoffset='0' opacity='0.3'/><path d='M35 50l10 10 20-20' stroke='%2300ff41' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="description" content="FitCircle - Mobile-friendly workout tracking app with progress circles" />
  </head>
  <body>
    <div id="root">
      <section id="fitcircle-startup" style="max-width:32rem;margin:10vh auto;padding:2rem;border-radius:1rem;font-family:system-ui">
        <h1>FitCircle</h1>
        <p id="fitcircle-startup-message" role="status">Opening FitCircle…</p>
        <button id="fitcircle-recover" type="button" hidden>Reload app safely</button>
        <p id="fitcircle-recover-note" hidden>Your fitness data stays on this device. Reconnect to the internet before reloading.</p>
        <noscript>Enable JavaScript to open FitCircle.</noscript>
      </section>
    </div>
    <script>
      // Keep recovery independent of the app bundle so a missing build asset
      // produces a useful screen instead of an empty page.
      (() => {
        const root = document.getElementById('root');
        const template = document.getElementById('fitcircle-startup').cloneNode(true);
        const showRecovery = () => {
          if (!document.getElementById('fitcircle-startup') && root.childElementCount) return;
          if (!document.getElementById('fitcircle-startup')) root.appendChild(template.cloneNode(true));
          document.getElementById('fitcircle-startup-message').textContent = 'FitCircle could not finish loading. You can safely reload the app without erasing your data.';
          const button = document.getElementById('fitcircle-recover');
          button.hidden = false;
          document.getElementById('fitcircle-recover-note').hidden = false;
          button.onclick = async () => {
            button.disabled = true;
            const message = document.getElementById('fitcircle-startup-message');
            try {
              const base = '%BASE_URL%';
              const destination = base + '?recovery=' + Date.now();
              const response = await fetch(destination, { cache: 'no-store' });
              if (!response.ok) throw new Error('The site is not available yet. Please wait for the GitHub Pages deployment and try again.');
              if ('serviceWorker' in navigator) {
                const reg = await navigator.serviceWorker.getRegistration(base);
                if (reg && reg.scope === new URL(base, location.origin).href) await reg.unregister();
              }
              location.replace(destination);
            } catch (error) {
              message.textContent = error.message || 'Could not reconnect. Your data has not been changed.';
              button.disabled = false;
            }
          };
        };
        window.addEventListener('error', () => setTimeout(showRecovery, 0), true);
        window.addEventListener('unhandledrejection', () => setTimeout(showRecovery, 0));
        setTimeout(showRecovery, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
