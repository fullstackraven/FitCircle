<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f172a"><!-- appearance-startup --><title>FitCircle</title></head>
<body style="color:var(--startup-foreground, #fff);background:var(--startup-background, #0f172a)"><p>Opening FitCircle… <a href="/FitCircle/">Home</a></p>
<script>
  const base = '/FitCircle/';
  if (location.pathname.startsWith(base)) {
    const route = location.pathname.slice(base.length - 1) + location.search + location.hash;
    location.replace(base + '?__fitcircle_route=' + encodeURIComponent(route));
  }
</script></body></html>
